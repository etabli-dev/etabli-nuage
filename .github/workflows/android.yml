name: Android verification
on:
  push:
    branches: [main, 'refine/**']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Robolectric downloads its Android runtime from Maven Central during the unit tests, with
      # no retry, and Maven Central answers busy CI runners with HTTP 429. The runtime is fetched
      # here with retries and cached by Robolectric version, independent of the Gradle cache key.
      # Keep both values in step with org.robolectric:robolectric in app/build.gradle.kts and the
      # @Config(sdk = ...) levels of the tests (13-robolectric-9030017-i7 is SDK 33 for 4.14.1).
      ROBOLECTRIC_VERSION: 4.14.1
      ROBOLECTRIC_ANDROID_ALL: 13-robolectric-9030017-i7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore the Robolectric Android runtime
        id: robolectric-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented/${{ env.ROBOLECTRIC_ANDROID_ALL }}
          key: robolectric-android-all-${{ env.ROBOLECTRIC_VERSION }}-${{ env.ROBOLECTRIC_ANDROID_ALL }}
      - name: Fetch the Robolectric Android runtime
        run: |
          set -euo pipefail
          grep -q "org.robolectric:robolectric:${ROBOLECTRIC_VERSION}\")" android/app/build.gradle.kts || {
            echo "::error::app/build.gradle.kts no longer uses Robolectric ${ROBOLECTRIC_VERSION}; update ROBOLECTRIC_VERSION and ROBOLECTRIC_ANDROID_ALL in this workflow."
            exit 1
          }
          sdks=$(grep -rhoE '@Config\(sdk = \[[0-9, ]+\]' android/app/src/test | grep -oE '[0-9]+' | sort -u | tr '\n' ' ')
          [ "$sdks" = "33 " ] || {
            echo "::error::Robolectric tests use SDK levels ${sdks}; this workflow pre-fetches only SDK 33 (${ROBOLECTRIC_ANDROID_ALL})."
            exit 1
          }
          name="android-all-instrumented-${ROBOLECTRIC_ANDROID_ALL}"
          dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/${ROBOLECTRIC_ANDROID_ALL}"
          url="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/${ROBOLECTRIC_ANDROID_ALL}/${name}"
          mkdir -p "$dir"
          for ext in pom pom.sha512 jar.sha512 jar; do
            if [ ! -s "$dir/$name.$ext" ]; then
              curl --fail --silent --show-error --location --retry 8 --retry-delay 20 --retry-all-errors \
                --output "$dir/$name.$ext.part" "$url.$ext"
              mv "$dir/$name.$ext.part" "$dir/$name.$ext"
            fi
          done
          for ext in pom jar; do
            echo "$(cut -d' ' -f1 "$dir/$name.$ext.sha512")  $dir/$name.$ext" | sha512sum --check --strict -
          done
      - name: Save the Robolectric Android runtime
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented/${{ env.ROBOLECTRIC_ANDROID_ALL }}
          key: ${{ steps.robolectric-cache.outputs.cache-primary-key }}
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and package
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Retain reports and unsigned build outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/bundle/release/
  swift-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile Foundation core
        run: >-
          swiftc ios/App/Models.swift ios/App/IO/CsvLoader.swift
          ios/App/Engine/Logger.swift ios/App/Engine/Checker.swift
          ios/App/Engine/UsageProfile.swift ios/App/Net/WebDavClient.swift
          scripts/check_core.swift -o /tmp/nuage-core-check
      - name: Exercise CSV, profiles, logs and HTTP failures
        run: python3 scripts/check_http.py /tmp/nuage-core-check
      - name: Build unsigned iOS simulator application
        run: xcodebuild -project ios/EtabliProbe.xcodeproj -target EtabliProbe -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS device Release app
        run: xcodebuild -project ios/EtabliProbe.xcodeproj -target EtabliProbe -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
